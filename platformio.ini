[platformio]
src_dir = .

[env:xiao_esp32s3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; USB CDC Settings
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Increase stack size to prevent crashes with large struct arrays
    -D CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192

    ; Libraries
; SD_MMC is built-in, no extra lib_deps needed.
lib_deps =
build_src_filter = +<main.cpp>

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
